[project]
name = "mrz-ai"
version = "0.1.0"
description = "TD3 passport MRZ recognition pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]
# The web reader. Kept an extra because the library itself does not need a web
# framework, and `mrz_ai.serve.payload` and `.crop` are deliberately importable
# without one.
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrz_ai"]

[tool.hatch.build.targets.wheel.force-include]
"src/mrz_ai/serve/static" = "mrz_ai/serve/static"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
